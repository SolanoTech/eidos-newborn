spring.application.name=eidos-consents
server.port=8082

# PostgreSQL datasource (база "consents")
spring.datasource.url=jdbc:postgresql://localhost:5432/consents
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Kafka: события о согласиях ---
# Переменные окружения: SPRING_KAFKA_BOOTSTRAP_SERVERS,
# EIDOS_CONSENTS_EVENTS_TOPIC, EIDOS_CONSENTS_EVENTS_ENABLED,
# EIDOS_CONSENTS_EVENTS_EXPIRY_CRON
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1

eidos.consents.events.topic=consent-events
eidos.consents.events.enabled=true
# Проход по истёкшим согласиям: ежедневно в 00:05.
eidos.consents.events.expiry-cron=0 5 0 * * *

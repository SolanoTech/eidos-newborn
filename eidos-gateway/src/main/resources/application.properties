spring.application.name=eidos-gateway
server.port=8090

# --- Gateway's own database (PostgreSQL): kafka_config ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gateway
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Shared source registry (read-only): source / source_contract / source_field ---
eidos.registry.datasource.url=jdbc:postgresql://localhost:5432/eidos_registry
eidos.registry.datasource.username=postgres
eidos.registry.datasource.password=postgres
eidos.registry.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false

# --- Admin (internal) REST token, header X-Admin-Token ---
gateway.admin-token=change-me-admin-token

# --- Downstream services ---
eidos.core.base-url=http://localhost:8080
eidos.consents.base-url=http://localhost:8082
eidos.stage.base-url=http://localhost:8081

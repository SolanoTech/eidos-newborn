server {
    listen 80;
    server_name _;

    # --- Фаза 2: admin-маршруты идут через Gravitee API Gateway ---
    # "gateway" — сервис gio_apim_gateway в общей docker-сети frontend.
    # Gravitee валидирует JWT Keycloak на краю и подставляет X-Admin-Token
    # для internal API stage/gateway; ui-backend в этих путях не участвует.
    #
    # Адрес Gravitee задан переменной, а имя разрешается встроенным DNS Docker
    # на каждом запросе. Литеральный upstream nginx разрешает один раз при
    # старте, и без контейнера Gravitee консоль не поднималась совсем — nginx
    # падал с "host not found in upstream", вместе с ним отказывали и экраны,
    # которым Gravitee не нужен (дашборд, аудит, согласия). Теперь без Gravitee
    # отвечают 502 только admin-маршруты.
    #
    # Переменная в proxy_pass отключает подстановку остатка пути, поэтому
    # префикс переписывается явно через rewrite: иначе /sources/5 ушло бы
    # в /eidos/sources. Строка запроса rewrite сохраняет сам.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/admin/sources {
        set $gravitee http://gateway:8082;
        rewrite ^/api/v1/admin/sources(.*)$ /eidos/sources$1 break;
        proxy_pass $gravitee;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/golden-record-fields {
        set $gravitee http://gateway:8082;
        rewrite ^/api/v1/admin/golden-record-fields(.*)$ /eidos/golden-record-fields$1 break;
        proxy_pass $gravitee;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/kafka-config {
        set $gravitee http://gateway:8082;
        rewrite ^/api/v1/admin/kafka-config(.*)$ /eidos/kafka-config$1 break;
        proxy_pass $gravitee;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/golden-records {
        set $gravitee http://gateway:8082;
        rewrite ^/api/v1/admin/golden-records(.*)$ /eidos/golden-records$1 break;
        proxy_pass $gravitee;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/conflicts {
        set $gravitee http://gateway:8082;
        rewrite ^/api/v1/admin/conflicts(.*)$ /eidos/conflicts$1 break;
        proxy_pass $gravitee;
        proxy_set_header Host $host;
    }

    location /api/v1/admin/legal-records {
        set $gravitee http://gateway:8082;
        rewrite ^/api/v1/admin/legal-records(.*)$ /eidos/legal-records$1 break;
        proxy_pass $gravitee;
        proxy_set_header Host $host;
    }
    # Длиннее, чем /api/v1/admin/conflicts, поэтому nginx выберет именно его
    # (побеждает самый длинный совпавший префикс).
    location /api/v1/admin/conflicts-legal {
        set $gravitee http://gateway:8082;
        rewrite ^/api/v1/admin/conflicts-legal(.*)$ /eidos/conflicts-legal$1 break;
        proxy_pass $gravitee;
        proxy_set_header Host $host;
    }

    # Остальное API (аудит, дашборд, согласия) — на ui-backend (resource server).
    location /api/ {
        proxy_pass http://eidos-cdi-ui-backend:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любые клиентские маршруты отдаём через index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

spring.application.name=eidos-core
server.port=8080

# PostgreSQL datasource (single DB for the SCV core module)
spring.datasource.url=jdbc:postgresql://localhost:5432/eidos_core
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Схемой владеет Flyway. validate только сверяет сущности со схемой: изменение
# сущности без миграции роняет приложение на старте, а не расходится молча.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Сервис согласий: сверка состояния по событию ---
# Переменные окружения: EIDOS_CONSENTS_BASE_URL, SPRING_KAFKA_BOOTSTRAP_SERVERS,
# EIDOS_CONSENTS_EVENTS_TOPIC, EIDOS_CONSENTS_EVENTS_GROUP_ID,
# EIDOS_CONSENTS_EVENTS_ENABLED
eidos.consents.base-url=http://localhost:8082
eidos.consents.events.topic=consent-events
eidos.consents.events.group-id=eidos-core-consent-state
eidos.consents.events.enabled=true

spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# --- Хранилище ключей (OpenBao) и токенизация ---
# Переменные окружения: EIDOS_CRYPTO_OPENBAO_BASE_URL, EIDOS_CRYPTO_OPENBAO_TOKEN,
# EIDOS_CRYPTO_OPENBAO_KEK_NAME, EIDOS_CRYPTO_ENABLED
eidos.crypto.openbao.base-url=http://localhost:8200
eidos.crypto.openbao.token=eidos-dev-root-token
eidos.crypto.openbao.kek-name=eidos-pd-kek
eidos.crypto.enabled=true

# --- Обезличивание записей без согласия ---
# Переменные окружения: EIDOS_CRYPTO_DEPERSONALISATION_SWEEP_ENABLED,
# EIDOS_CRYPTO_DEPERSONALISATION_SWEEP_CRON, EIDOS_CRYPTO_DEPERSONALISATION_BATCH_SIZE
eidos.crypto.depersonalisation.sweep-enabled=true
# Страховочный проход: ежечасно. Основной путь — обработка события о согласии.
eidos.crypto.depersonalisation.sweep-cron=0 20 * * * *
eidos.crypto.depersonalisation.batch-size=200

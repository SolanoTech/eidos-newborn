<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eidos SCV — Customer Journey Map (слайд)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
:root{
 --bg-primary:#ffffff; --bg-page:#fbfaf7;
 --text-primary:#1a1a18; --text-secondary:#5F5E5A; --text-tertiary:#888780;
 --border:rgba(0,0,0,0.14);
 --admin-fill:#E6F1FB; --admin-text:#185FA5;
 --stew-fill:#E1F5EE; --stew-text:#0F6E56;
 --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
 :root{
  --bg-primary:#26261f; --bg-page:#1c1c17;
  --text-primary:#f3f1e9; --text-secondary:#b4b2a9; --text-tertiary:#888780;
  --border:rgba(255,255,255,0.16);
  --admin-fill:#0C447C; --admin-text:#B5D4F4;
  --stew-fill:#0F6E56; --stew-text:#9FE1CB;
 }
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg-page); color:var(--text-primary); font-family:var(--font-sans); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;}
.slide{width:100%; max-width:1120px; aspect-ratio:16/9; background:var(--bg-primary); border:0.5px solid var(--border); border-radius:16px; padding:40px 48px; display:flex; flex-direction:column;}
.slide-head{margin-bottom:26px;}
.slide-head h1{font-size:26px; font-weight:500; margin:0;}
.slide-head p{font-size:15px; color:var(--text-secondary); margin:6px 0 0;}
.lanes{flex:1; display:flex; flex-direction:column; justify-content:center; gap:30px;}
.lane-head{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.role-pill{display:inline-flex; align-items:center; gap:9px; font-size:16px; font-weight:500; padding:6px 16px; border-radius:24px;}
.role-pill i{font-size:20px;}
.role-val{font-size:14px; color:var(--text-secondary);}
.track{display:flex; align-items:stretch; gap:0;}
.step{flex:1 1 0; min-width:0; border:0.5px solid var(--border); border-radius:10px; padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px;}
.step .num{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500;}
.step .ttl{font-size:14px; font-weight:500; line-height:1.25;}
.step .cap{font-size:12.5px; color:var(--text-secondary); line-height:1.35;}
.conn{flex:0 0 26px; display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); font-size:22px;}
.slide-foot{margin-top:26px; font-size:13px; color:var(--text-tertiary);}
</style>
</head>
<body>
<div class="slide">
  <div class="slide-head">
    <h1>Eidos SCV — карта пути пользователя</h1>
    <p>Единый профиль клиента · две роли, два сценария ценности</p>
  </div>
  <div class="lanes" id="lanes"></div>
  <div class="slide-foot">Customer Journey Map · Single Customer View</div>
</div>

<script>
const lanes=[
 {role:"Администратор источников", icon:"ti-database", val:"Подключение источника без программирования",
  fill:"var(--admin-fill)", text:"var(--admin-text)",
  steps:[
   ["Оценка источника","Какие данные он даёт"],
   ["Регистрация","Источник и доступ"],
   ["Соответствие данных","Сопоставление полей профиля"],
   ["Запуск приёма","Включить поток данных"],
   ["Проверка","Принято или отклонено"],
   ["Сопровождение","Правки и контроль"]
  ]},
 {role:"Дата-стюард", icon:"ti-shield-check", val:"Качество и прослеживаемость профиля клиента",
  fill:"var(--stew-fill)", text:"var(--stew-text)",
  steps:[
   ["Обзор очереди","Что ждёт решения"],
   ["Разбор расхождения","Сравнить источники"],
   ["Разрешение","Выбрать достоверное"],
   ["Неизвестный источник","Создать или отклонить"],
   ["Поиск профиля","Найти клиента"],
   ["Происхождение и история","Источник и изменения"]
  ]}
];
document.getElementById('lanes').innerHTML=lanes.map(l=>`
 <div class="lane">
   <div class="lane-head">
     <span class="role-pill" style="background:${l.fill}; color:${l.text};"><i class="ti ${l.icon}" aria-hidden="true"></i>${l.role}</span>
     <span class="role-val">${l.val}</span>
   </div>
   <div class="track">
     ${l.steps.map((s,i)=>`
       <div class="step" style="border-top:2px solid ${l.text};">
         <span class="num" style="background:${l.fill}; color:${l.text};">${i+1}</span>
         <span class="ttl">${s[0]}</span>
         <span class="cap">${s[1]}</span>
       </div>
       ${i<l.steps.length-1?`<div class="conn"><i class="ti ti-chevron-right" aria-hidden="true"></i></div>`:''}
     `).join('')}
   </div>
 </div>`).join('');
</script>
</body>
</html>

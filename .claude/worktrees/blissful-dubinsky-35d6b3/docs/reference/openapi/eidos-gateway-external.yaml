openapi: 3.1.0
info:
  description: |-
    Внешний интерфейс Eidos CDI: единственная точка, через которую системы-источники передают данные и обращаются к Золотым записям и согласиям.

    Внешние пути требуют токен источника в заголовке `X-Access-Token`; код источника шлюз берёт из токена и сам подставляет в запрос. Административные пути `/internal/**` закрыты заголовком `X-Admin-Token` и не должны быть доступны снаружи.

    Ошибки — `{"detail": "…"}`. Ответы eidos-stage, eidos-core и eidos-consents шлюз возвращает без изменений.
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: eidos-gateway
  version: v1
servers:
- url: /
  description: "Адрес, с которого получена спецификация"
- url: http://localhost:8090
  description: "Стенд Docker Compose, с хоста"
- url: http://eidos-gateway:8090
  description: Внутри сети Docker Compose
tags:
- description: "Карточки физических и юридических лиц от систем-источников. Тип сущности задаётся путём, а не телом"
  name: Приём данных
- description: "Согласия клиентов на обработку данных: регистрация, чтение и отзыв. Запросы уходят в eidos-consents; его ответы шлюз возвращает без изменений"
  name: Согласия
- description: "Внешний API Золотых записей eidos-core для систем-потребителей — за шлюзом, с токеном источника"
  name: Золотые записи
- description: Проба живости для оркестратора и мониторинга
  name: Служебные
paths:
  /api/v1/client-data:
    post:
      description: "Шлюз проверяет карточку по дата-контракту источника для физлиц, записывает в поле `source` код источника из токена и передаёт карточку в eidos-stage. Ответ eidos-stage возвращается без изменений."
      operationId: ingestClientData
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: "Карточка обработана ядром: `{\"status\":\"SUCCESS\"}`"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет заголовка `X-Access-Token` или токен неизвестен: `Missing X-Access-Token`, `Invalid access token`"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет дата-контракта источника для физлиц, тело — не JSON-объект, нарушен контракт (нарушения перечислены через `; `) или карточку отклонили eidos-stage либо ядро"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Сбой шлюза или eidos-stage недоступен
      security:
      - X-Access-Token: []
      summary: Принять карточку физлица
      tags:
      - Приём данных
  /api/v1/consents:
    post:
      description: "Тело — как у eidos-consents, но `source_name` присылать не нужно: шлюз записывает туда код источника из токена. Идентификатор клиента принимается как `GR_<uuid>` и как `<uuid>`. После сохранения eidos-consents публикует событие `new`."
      operationId: createConsent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentCreatedResponse"
          description: Согласие зарегистрировано
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет заголовка `X-Access-Token` или токен неизвестен: `Missing X-Access-Token`, `Invalid access token`"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет `client_uuid` или это не идентификатор Золотой записи, тело — не JSON-объект, не заполнено обязательное поле: `<поле>: must not be null`"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Прочие ошибки eidos-consents — с её кодом и телом; например, неизвестный код типа"
      security:
      - X-Access-Token: []
      summary: Зарегистрировать согласие
      tags:
      - Согласия
  /api/v1/consents/active/{clientId}:
    get:
      description: "Последнее по дате начала согласие типа `type`, действующее сегодня."
      operationId: getActiveConsent
      parameters:
      - description: "Идентификатор Золотой записи физлица: `GR_<uuid>` или `<uuid>`"
        example: GR_5f0c2b1e-8a4d-4c55-9a8e-2b7d4f1c9e10
        in: path
        name: clientId
        required: true
        schema:
          type: string
      - description: "**Имя** типа согласия, а не код: в параметре запроса eidos-consents принимает имя"
        in: query
        name: type
        required: true
        schema:
          type: string
          enum:
          - PERSONAL_DATA
          - BIO
          - MARKETING_SMS
          - MARKETING_PUSH
          - MARKETING_EMAIL
          - PROFILING
          - THIRD_PARTY
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentView"
          description: Действующее согласие
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Не передан `type` или такого имени типа нет
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет заголовка `X-Access-Token` или токен неизвестен: `Missing X-Access-Token`, `Invalid access token`"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Действующего согласия нет: `No active consent of type <TYPE> for client <uuid>`"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: '`clientId` — не идентификатор Золотой записи'
      security:
      - X-Access-Token: []
      summary: Действующее согласие одного типа
      tags:
      - Согласия
  /api/v1/consents/client/{clientId}:
    get:
      description: "По каждому из семи типов — последнее согласие и признак действия на сегодня. Клиент без согласий получает все типы с `active: false`."
      operationId: getClientConsents
      parameters:
      - description: "Идентификатор Золотой записи физлица: `GR_<uuid>` или `<uuid>`"
        example: GR_5f0c2b1e-8a4d-4c55-9a8e-2b7d4f1c9e10
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsentStatus"
          description: Сводка по типам
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет заголовка `X-Access-Token` или токен неизвестен: `Missing X-Access-Token`, `Invalid access token`"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: '`clientId` — не идентификатор Золотой записи'
      security:
      - X-Access-Token: []
      summary: Согласия клиента по всем типам
      tags:
      - Согласия
  /api/v1/consents/{id}/revoke:
    post:
      description: "Передаётся в eidos-consents как `POST /internal/api/v1/consents/{id}/revoke`: дата окончания переносится на вчерашний день, история сохраняется. Ответ eidos-consents возвращается без изменений."
      operationId: revokeConsent
      parameters:
      - description: Идентификатор согласия
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentView"
          description: Согласие отозвано
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет заголовка `X-Access-Token` или токен неизвестен: `Missing X-Access-Token`, `Invalid access token`"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Согласия нет: `Consent <id> not found`"
      security:
      - X-Access-Token: []
      summary: Отозвать согласие
      tags:
      - Согласия
  /api/v1/external/golden-records/{path}:
    get:
      description: |-
        Запрос передаётся в eidos-core без изменений: тот же путь, query-параметры, тело и заголовки, кроме `X-Access-Token` и `X-Admin-Token`. Ответ eidos-core возвращается как есть.

        `search/accurate` — точный поиск, `search/source-id` — по идентификатору в системе-источнике. Параметры, тела и коды ответов — в спецификации eidos-core, группа `external`.
      operationId: proxyGoldenRecordsGet
      responses:
        "2XX":
          description: Ответ eidos-core — тело по спецификации eidos-core
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет заголовка `X-Access-Token` или токен неизвестен: `Missing X-Access-Token`, `Invalid access token`"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Ошибка eidos-core, например `404 Golden Record Not Found`"
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Сбой eidos-core или он недоступен
      security:
      - X-Access-Token: []
      summary: Поиск Золотой записи — прокси в eidos-core
      tags:
      - Золотые записи
    parameters:
    - description: Остаток пути после `/api/v1/external/golden-records/`; может содержать `/`
      example: search/accurate
      in: path
      name: path
      required: true
      schema:
        type: string
    post:
      description: |-
        Запрос передаётся в eidos-core без изменений: тот же путь, query-параметры, тело и заголовки, кроме `X-Access-Token` и `X-Admin-Token`. Ответ eidos-core возвращается как есть.

        `{uuid}/external-id` — привязать идентификатор клиента в системе-источнике. Параметры, тела и коды ответов — в спецификации eidos-core, группа `external`.
      operationId: proxyGoldenRecordsPost
      responses:
        "2XX":
          description: Ответ eidos-core — тело по спецификации eidos-core
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет заголовка `X-Access-Token` или токен неизвестен: `Missing X-Access-Token`, `Invalid access token`"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Ошибка eidos-core, например `404 Golden Record Not Found`"
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Сбой eidos-core или он недоступен
      security:
      - X-Access-Token: []
      summary: Привязка внешнего идентификатора — прокси в eidos-core
      tags:
      - Золотые записи
    put:
      description: |-
        Запрос передаётся в eidos-core без изменений: тот же путь, query-параметры, тело и заголовки, кроме `X-Access-Token` и `X-Admin-Token`. Ответ eidos-core возвращается как есть.

        `{uuid}/external-id` — по записи, `external-id` — по прежнему значению. Параметры, тела и коды ответов — в спецификации eidos-core, группа `external`.
      operationId: proxyGoldenRecordsPut
      responses:
        "2XX":
          description: Ответ eidos-core — тело по спецификации eidos-core
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет заголовка `X-Access-Token` или токен неизвестен: `Missing X-Access-Token`, `Invalid access token`"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Ошибка eidos-core, например `404 Golden Record Not Found`"
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Сбой eidos-core или он недоступен
      security:
      - X-Access-Token: []
      summary: Изменение внешнего идентификатора — прокси в eidos-core
      tags:
      - Золотые записи
  /api/v1/legal-data:
    post:
      description: "Как приём карточки физлица, но по дата-контракту источника для юрлиц (`LEGAL_ENTITY`) и в Золотую запись юрлица."
      operationId: ingestLegalData
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: "Карточка обработана ядром: `{\"status\":\"SUCCESS\"}`"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет заголовка `X-Access-Token` или токен неизвестен: `Missing X-Access-Token`, `Invalid access token`"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нет дата-контракта источника для юрлиц, тело — не JSON-объект, нарушен контракт (нарушения перечислены через `; `) или карточку отклонили eidos-stage либо ядро"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Сбой шлюза или eidos-stage недоступен
      security:
      - X-Access-Token: []
      summary: Принять карточку юрлица
      tags:
      - Приём данных
  /health:
    get:
      description: Без аутентификации.
      operationId: health
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: Сервис работает
      summary: Проба живости
      tags:
      - Служебные
components:
  schemas:
    ConsentCreatedResponse:
      type: object
      description: Зарегистрированное согласие
      properties:
        data:
          $ref: "#/components/schemas/ConsentView"
          description: Согласие
        detail:
          type: string
          description: Пояснение
          example: Consent created
    ConsentRequest:
      type: object
      description: Регистрация согласия источником
      properties:
        client_uuid:
          type: string
          description: "Идентификатор Золотой записи физлица: `GR_<uuid>` или `<uuid>`; префикс шлюз снимает"
          example: GR_5f0c2b1e-8a4d-4c55-9a8e-2b7d4f1c9e10
        end_date:
          type: string
          format: date
          description: "Окончание действия, включительно. Если не задано — полгода для `pd` и `bio`, год для остальных типов"
        initial_date:
          type: string
          format: date
          description: Начало действия
        source_name:
          type: string
          deprecated: true
          description: "Не нужен: шлюз записывает сюда код источника из токена"
        type:
          type: string
          description: Код типа согласия
          enum:
          - pd
          - bio
          - mk_sms
          - mk_push
          - mk_email
          - profiling
          - third_party
      required:
      - client_uuid
      - initial_date
      - type
    ConsentStatus:
      type: object
      description: Состояние согласия клиента одного типа
      properties:
        active:
          type: boolean
          description: Действует ли последнее согласие этого типа сегодня
        code:
          type: string
          description: Код типа
          example: pd
        consentId:
          type: string
          format: uuid
          description: "Последнее согласие типа; `null`, если согласий не было"
        endDate:
          type: string
          format: date
          description: "Окончание действия, включительно"
        startDate:
          type: string
          format: date
          description: Начало действия последнего согласия
        type:
          type: string
          description: Имя типа
          example: PERSONAL_DATA
    ConsentView:
      type: object
      description: Согласие
      properties:
        client_uuid:
          type: string
          format: uuid
          description: "Идентификатор Золотой записи физлица, без префикса `GR_`"
        end_date:
          type: string
          format: date
          description: "Окончание действия, включительно"
        id:
          type: string
          format: uuid
          description: Идентификатор согласия
        source:
          type: string
          description: "Код источника, зарегистрировавшего согласие"
          example: bank-1
        start_date:
          type: string
          format: date
          description: Начало действия
        type:
          type: string
          description: Код типа согласия
          example: pd
    ErrorResponse:
      type: object
      description: "Ошибка: единая форма ответа сервисов Eidos CDI"
      properties:
        detail:
          type: string
          description: Что пошло не так
      required:
      - detail
    IngestRequest:
      type: object
      description: Карточка от системы-источника
      properties:
        data:
          type: object
          additionalProperties: {}
          description: "Карточка в формате источника. Какие поля обязательны и в каком формате, задаёт дата-контракт источника для этого типа сущности."
          example:
            client_id: CL-778812
            last_name: Каримов
            first_name: Алишер
        source:
          type: string
          deprecated: true
          description: "Не нужен: шлюз записывает сюда код источника из токена, присланное значение заменяется"
      required:
      - data
    StatusResponse:
      type: object
      description: Итог операции
      properties:
        status:
          type: string
          description: Код итога
          example: SUCCESS
  securitySchemes:
    X-Access-Token:
      description: Токен источника из реестра; выдаёт администратор платформы. Дальше шлюза не передаётся.
      in: header
      name: X-Access-Token
      type: apiKey
    X-Admin-Token:
      description: Административный токен из настройки `gateway.admin-token`
      in: header
      name: X-Admin-Token
      type: apiKey

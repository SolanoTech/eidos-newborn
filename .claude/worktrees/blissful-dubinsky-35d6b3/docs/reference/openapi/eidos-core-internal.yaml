openapi: 3.1.0
info:
  description: |-
    Ядро Eidos CDI: хранит Золотые записи физических и юридических лиц, сопоставляет с ними входящие карточки, сливает по уровню доверия источника и отдаёт результат потребителям.

    Аутентификации нет: сервис держат во внутренней сети. Системы-потребители вызывают внешние пути `/api/v1/external/**` через eidos-gateway — тот же путь, с токеном источника в заголовке `X-Access-Token`.

    Идентификаторы Золотых записей: `GR_<uuid>` у физлиц, `LE_<uuid>` у юрлиц. Списки отдаются страницами по 20 записей; параметр `page` считается с единицы, поле `number` в ответе — с нуля.

    Ошибки — `{"detail": "…"}`. В текущей версии отсутствующий обязательный параметр или параметр в неверном формате дают `500`, а не `400`.
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: eidos-core
  version: v1
servers:
- url: /
  description: "Адрес, с которого получена спецификация"
- url: http://localhost:8080
  description: "Стенд Docker Compose, с хоста"
- url: http://eidos-core:8080
  description: Внутри сети Docker Compose
tags:
- description: "Золотые записи физических лиц: приём карточек, поиск, карточка, происхождение полей"
  name: Физлица
- description: "Золотые записи юридических лиц (мерчантов): приём карточек, поиск, карточка, происхождение полей"
  name: Юрлица
- description: Показатели объёма и качества данных для дашборда
  name: Метрики
- description: "Карточки физлиц, которые не удалось применить автоматически: от неизвестного источника или с конфликтом при равном доверии"
  name: "Очередь разбора: физлица"
- description: Та же очередь для карточек юридических лиц
  name: "Очередь разбора: юрлица"
- description: Проба живости для оркестратора и мониторинга
  name: Служебные
paths:
  /api/v1/internal/golden-records:
    post:
      description: "Вызывает eidos-stage. Запись ищется по идентификатору в источнике, затем точным сопоставлением по ФИО, дате рождения и ПИНФЛ или паспорту; не найдена — создаётся, найдена — сливается по уровню доверия источника. Конфликт при равном доверии уходит в очередь разбора, ответ при этом тоже `200`."
      operationId: saveGoldenRecord
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostGoldenRecordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: "Запись создана, слита или конфликт отправлен на разбор"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Источника нет в ядре: `Source <код> not found`. Карточка записана в очередь разбора как `UNKNOWN_SOURCE`"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нарушены обязательность или форматы карточки: `<свойство>: <сообщение>; …`"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Сбой при сохранении, например нарушение уникальности ПИНФЛ"
      summary: Принять карточку физлица
      tags:
      - Физлица
  /api/v1/internal/golden-records/search:
    get:
      description: "Подстрока с учётом регистра в фамилии, имени, паспорте или ПИНФЛ. Страницы по 20 записей, по времени создания."
      operationId: searchGoldenRecords
      parameters:
      - description: Образец
        in: query
        name: query
        required: true
        schema:
          type: string
      - description: Номер страницы с единицы
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageGoldenRecord"
          description: Страница записей
      summary: Поиск по образцу
      tags:
      - Физлица
  /api/v1/internal/golden-records/search/structured:
    get:
      description: "Пустые критерии не участвуют; без критериев — первая страница всех записей. Страницы по 20 записей, по времени создания."
      operationId: searchGoldenRecordsStructured
      parameters:
      - description: "ПИНФЛ целиком: сравнение по слепому индексу, нецифровые символы отбрасываются"
        in: query
        name: pinfl
        required: false
        schema:
          type: string
      - description: Подстрока паспорта; пробелы и регистр не важны
        in: query
        name: passport
        required: false
        schema:
          type: string
      - description: Подстрока фамилии без учёта регистра
        in: query
        name: lastName
        required: false
        schema:
          type: string
      - description: Подстрока имени без учёта регистра
        in: query
        name: firstName
        required: false
        schema:
          type: string
      - description: Подстрока отчества без учёта регистра
        in: query
        name: middleName
        required: false
        schema:
          type: string
      - description: Подстрока телефона; учитываются только цифры
        in: query
        name: phone
        required: false
        schema:
          type: string
      - description: Номер страницы с единицы
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageGoldenRecord"
          description: Страница записей
      summary: Поиск по реквизитам
      tags:
      - Физлица
  /api/v1/internal/golden-records/{clientId}:
    get:
      operationId: getGoldenRecord
      parameters:
      - description: "Идентификатор записи, `GR_<uuid>`"
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldenRecord"
          description: Золотая запись
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Записи нет: `Golden Record Not Found`"
      summary: Карточка физлица
      tags:
      - Физлица
  /api/v1/internal/golden-records/{clientId}/external-ids:
    get:
      description: По алфавиту кодов источников; для неизвестной записи — пустой список.
      operationId: getGoldenRecordExternalIds
      parameters:
      - description: "Идентификатор записи, `GR_<uuid>`"
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalIdView"
          description: Связки с источниками
      summary: Идентификаторы в системах-источниках
      tags:
      - Физлица
  /api/v1/internal/golden-records/{clientId}/field-meta:
    get:
      description: Какой источник и с каким доверием поставил каждое поле и когда. По алфавиту имён полей; для неизвестной записи — пустой список.
      operationId: getGoldenRecordFieldMeta
      parameters:
      - description: "Идентификатор записи, `GR_<uuid>`"
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldMetaView"
          description: Происхождение полей
      summary: Происхождение полей
      tags:
      - Физлица
  /api/v1/internal/legal-records:
    post:
      description: "Вызывает eidos-stage. Запись ищется по идентификатору в источнике, затем по ИНН; не найдена — создаётся, найдена — сливается по уровню доверия источника. Конфликт при равном доверии уходит в очередь разбора, ответ при этом тоже `200`."
      operationId: saveLegalEntity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostLegalEntityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: "Запись создана, слита или конфликт отправлен на разбор"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Источника нет в ядре: `Source <код> not found`. Карточка записана в очередь разбора как `UNKNOWN_SOURCE`"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Нарушены обязательность или форматы карточки: `<свойство>: <сообщение>; …`"
      summary: Принять карточку юрлица
      tags:
      - Юрлица
  /api/v1/internal/legal-records/search/inn:
    get:
      operationId: searchLegalEntityByInn
      parameters:
      - description: ИНН
        in: query
        name: inn
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityRecord"
          description: Запись юрлица
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "ИНН пустой: `INN is required`"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Записи нет: `Legal entity with INN <ИНН> not found`"
      summary: Точный поиск юрлица по ИНН
      tags:
      - Юрлица
  /api/v1/internal/legal-records/search/name:
    get:
      description: "Триграммное сходство нормализованного названия с запросом. Страницы по 20 записей, по убыванию сходства. Если после нормализации от запроса ничего не осталось, страница пуста."
      operationId: searchLegalEntitiesByName
      parameters:
      - description: Название или его часть
        in: query
        name: query
        required: true
        schema:
          type: string
      - description: Номер страницы с единицы
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - description: "Порог сходства от 0 до 1, по умолчанию 0,3"
        in: query
        name: threshold
        required: false
        schema:
          type: number
          format: double
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageLegalEntityRecord"
          description: Страница записей
      summary: Неточный поиск юрлица по названию
      tags:
      - Юрлица
  /api/v1/internal/legal-records/{grLegalEntityId}:
    get:
      operationId: getLegalEntity
      parameters:
      - description: "Идентификатор записи, `LE_<uuid>`"
        in: path
        name: grLegalEntityId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityRecord"
          description: Запись юрлица
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Записи нет: `Legal entity <id> not found`"
      summary: Карточка юрлица
      tags:
      - Юрлица
  /api/v1/internal/legal-records/{grLegalEntityId}/external-ids:
    get:
      description: По алфавиту кодов источников; для неизвестной записи — пустой список.
      operationId: getLegalEntityExternalIds
      parameters:
      - description: "Идентификатор записи, `LE_<uuid>`"
        in: path
        name: grLegalEntityId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalIdView"
          description: Связки с источниками
      summary: Идентификаторы в системах-источниках
      tags:
      - Юрлица
  /api/v1/internal/legal-records/{grLegalEntityId}/field-meta:
    get:
      description: Какой источник и с каким доверием поставил каждое поле и когда. По алфавиту имён полей; для неизвестной записи — пустой список.
      operationId: getLegalEntityFieldMeta
      parameters:
      - description: "Идентификатор записи, `LE_<uuid>`"
        in: path
        name: grLegalEntityId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldMetaView"
          description: Происхождение полей
      summary: Происхождение полей
      tags:
      - Юрлица
  /api/v1/internal/metrics:
    get:
      description: Считаются по Золотым записям физлиц и очереди их разбора при каждом запросе.
      operationId: getMetrics
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
          description: Метрики
      summary: Метрики качества данных
      tags:
      - Метрики
  /api/v1/internal/tentative:
    get:
      description: "Новые записи первыми, страницы по 20."
      operationId: listTentative
      parameters:
      - description: Причина; без неё — все записи
        in: query
        name: reason
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_SOURCE
          - GREY_ZONE_CONFLICT
      - description: Номер страницы с единицы
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageTentativeItemView"
          description: Страница записей очереди
      summary: Очередь разбора
      tags:
      - "Очередь разбора: физлица"
  /api/v1/internal/tentative-legal:
    get:
      description: "Новые записи первыми, страницы по 20."
      operationId: listTentativeLegal
      parameters:
      - description: Причина; без неё — все записи
        in: query
        name: reason
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_SOURCE
          - GREY_ZONE_CONFLICT
      - description: Номер страницы с единицы
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageTentativeLegalItemView"
          description: Страница записей очереди
      summary: Очередь разбора юрлиц
      tags:
      - "Очередь разбора: юрлица"
  /api/v1/internal/tentative-legal/count:
    get:
      operationId: countTentativeLegal
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TentativeCounts"
          description: Счётчики
      summary: Размер очереди юрлиц по причинам
      tags:
      - "Очередь разбора: юрлица"
  /api/v1/internal/tentative-legal/{id}/resolve:
    post:
      description: Запись покидает очередь при любом решении. `ACCEPT_INCOMING` переключает происхождение изменённых полей на источник снимка и сохраняет прежнее состояние записи в архив.
      operationId: resolveTentativeLegal
      parameters:
      - description: Идентификатор записи очереди
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveLegalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                status: RESOLVED
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: Запись разобрана
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Записи нет: `Tentative legal entity <id> not found`"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "`ACCEPT_INCOMING` неприменим: у записи нет юрлица, к которому её применить, или источник снимка не зарегистрирован в ядре"
      summary: Разобрать запись юрлица
      tags:
      - "Очередь разбора: юрлица"
  /api/v1/internal/tentative/count:
    get:
      operationId: countTentative
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TentativeCounts"
          description: Счётчики
      summary: Размер очереди по причинам
      tags:
      - "Очередь разбора: физлица"
  /api/v1/internal/tentative/{id}/resolve:
    post:
      description: Запись покидает очередь при любом решении. `ACCEPT_INCOMING` переключает происхождение изменённых полей на источник снимка и сохраняет прежнее состояние записи в архив.
      operationId: resolveTentative
      parameters:
      - description: Идентификатор записи очереди
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                status: RESOLVED
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: Запись разобрана
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Записи нет: `Tentative record <id> not found`"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "`ACCEPT_INCOMING` неприменим: запись от неизвестного источника (`Unknown source records cannot be merged: register the source and resend the data`) или источник снимка не зарегистрирован в ядре"
      summary: Разобрать запись
      tags:
      - "Очередь разбора: физлица"
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
          description: Сервис работает
      summary: Проба живости
      tags:
      - Служебные
components:
  schemas:
    ErrorResponse:
      type: object
      description: "Ошибка: единая форма ответа сервисов Eidos CDI"
      properties:
        detail:
          type: string
          description: Что пошло не так
      required:
      - detail
    ExternalIdView:
      type: object
      description: Связка записи с идентификатором клиента в системе-источнике
      properties:
        active:
          type: boolean
          description: Действует ли связка
        createdAt:
          type: string
          format: date-time
          description: Когда связка создана
        externalId:
          type: string
          description: Идентификатор клиента в источнике
          example: CL-778812
        sourceName:
          type: string
          description: Код источника
          example: bank-1
    FieldMetaView:
      type: object
      description: Происхождение одного поля Золотой записи
      properties:
        fieldName:
          type: string
          description: Поле записи
          example: grFirstName
        sourceName:
          type: string
          description: "Код источника, поставившего значение"
          example: bank-1
        trustLevel:
          type: integer
          format: int32
          description: Уровень доверия источника
        updatedAt:
          type: string
          format: date-time
          description: Когда значение обновлено
    Founder:
      type: object
      properties:
        inn:
          type: string
          pattern: "^\\d{9}$"
        name:
          type: string
          maxLength: 500
          minLength: 0
        pinfl:
          type: string
          pattern: "^\\d{14}$"
        sharePercent:
          type: number
        uuid:
          type: string
          maxLength: 64
          minLength: 0
    GoldenRecord:
      type: object
      description: "Золотая запись физлица. Деловые поля — те же, что в контракте Золотой записи, в camelCase (`GR_FirstName` → `grFirstName`); их описание — в справочнике полей. Ниже описаны служебные поля."
      properties:
        createdAt:
          type: string
          format: date-time
          description: Когда запись создана
        grAddrPermRegAddress:
          type: string
        grAddrPermRegCadastre:
          type: string
        grAddrPermRegCountry:
          type: string
        grAddrPermRegCountryId:
          type: string
        grAddrPermRegDistrict:
          type: string
        grAddrPermRegDistrictId:
          type: string
        grAddrPermRegMfy:
          type: string

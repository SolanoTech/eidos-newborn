# Тестовый профиль: H2 вместо PostgreSQL, чтобы контекст поднимался без внешней БД.
spring.datasource.url=jdbc:h2:mem:eidos_ui_backend;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Resource server: JWKS-URI нужен контексту; в тестах декодер не дергается
# (мокируется SecurityMockMvcRequestPostProcessors.jwt()).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/eidos/protocol/openid-connect/certs

# --- Downstream-сервисы (в юнит-тестах не вызываются, нужны для контекста) ---
eidos.stage.base-url=http://localhost:8081
eidos.stage.admin-token=test-admin-token
eidos.gateway.base-url=http://localhost:8090
eidos.gateway.admin-token=test-admin-token
eidos.core.base-url=http://localhost:8080
eidos.consents.base-url=http://localhost:8085

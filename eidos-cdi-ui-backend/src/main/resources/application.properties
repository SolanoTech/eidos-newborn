spring.application.name=eidos-cdi-ui-backend
server.port=8083

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/eidos_ui_backend
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- eidos-stage (admin API: реестр источников, конструктор) ---
eidos.stage.base-url=http://localhost:8081
eidos.stage.admin-token=change-me-admin-token

# --- eidos-gateway (admin API: конфигурация Kafka) ---
eidos.gateway.base-url=http://localhost:8090
eidos.gateway.admin-token=change-me-admin-token

# --- eidos-core (internal API: поиск Golden Record) ---
eidos.core.base-url=http://localhost:8080

# --- eidos-consents (internal API: согласия клиента) ---
eidos.consents.base-url=http://localhost:8086

# --- Keycloak (resource server) ---
# Токены выпускает Keycloak (realm eidos); здесь только проверка подписи по JWKS.
# jwk-set-uri вместо issuer-uri: не требует резолвить issuer из контейнера.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/eidos/protocol/openid-connect/certs

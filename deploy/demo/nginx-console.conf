# Конфиг nginx консолей для демонстрационного стенда: без Gravitee.
#
# В штатной сборке админские пути идут в Gravitee, который проверяет JWT
# Keycloak и подставляет X-Admin-Token. На стенде Gravitee нет (это самая
# тяжёлая часть, ~2,5–3 ГБ), поэтому nginx обращается к сервисам напрямую и
# подставляет токен сам.
#
# Следствие, которое надо держать в голове: JWT пользователя на этих путях
# никто не проверяет. Поэтому стенд целиком закрыт basic-аутентификацией на
# Caddy. Этот конфиг пригоден только для демонстрационного стенда с
# выдуманными данными — в продуктив он не годится.
#
# ${ADMIN_TOKEN} подставляет entrypoint образа nginx (envsubst по шаблону в
# /etc/nginx/templates). Имена сервисов разрешаются на каждом запросе через
# встроенный DNS Docker, поэтому nginx поднимается, даже если сервис ещё не
# готов, и отвечает 502 вместо отказа запуска.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Реестр источников и каталог полей: eidos-stage, нужен служебный токен ---
    location /api/v1/admin/sources {
        set $stage http://eidos-stage:8081;
        rewrite ^/api/v1/admin/sources(.*)$ /internal/api/v1/sources$1 break;
        proxy_pass $stage;
        proxy_set_header X-Admin-Token "${ADMIN_TOKEN}";
        proxy_set_header Host $host;
    }

    location /api/v1/admin/golden-record-fields {
        set $stage http://eidos-stage:8081;
        rewrite ^/api/v1/admin/golden-record-fields(.*)$ /internal/api/v1/golden-record-fields$1 break;
        proxy_pass $stage;
        proxy_set_header X-Admin-Token "${ADMIN_TOKEN}";
        proxy_set_header Host $host;
    }

    # --- Каналы Kafka: eidos-gateway, нужен служебный токен ---
    location /api/v1/admin/kafka-config {
        set $gw http://eidos-gateway:8090;
        rewrite ^/api/v1/admin/kafka-config(.*)$ /internal/api/v1/kafka-config$1 break;
        proxy_pass $gw;
        proxy_set_header X-Admin-Token "${ADMIN_TOKEN}";
        proxy_set_header Host $host;
    }

    # --- Золотые записи и очереди конфликтов: eidos-core, токен не нужен ---
    location /api/v1/admin/golden-records {
        set $core http://eidos-core:8080;
        rewrite ^/api/v1/admin/golden-records(.*)$ /api/v1/internal/golden-records$1 break;
        proxy_pass $core;
        proxy_set_header Host $host;
    }

    location /api/v1/admin/legal-records {
        set $core http://eidos-core:8080;
        rewrite ^/api/v1/admin/legal-records(.*)$ /api/v1/internal/legal-records$1 break;
        proxy_pass $core;
        proxy_set_header Host $host;
    }

    # Длиннее, чем /api/v1/admin/conflicts, поэтому nginx выберет именно его
    # (побеждает самый длинный совпавший префикс).
    location /api/v1/admin/conflicts-legal {
        set $core http://eidos-core:8080;
        rewrite ^/api/v1/admin/conflicts-legal(.*)$ /api/v1/internal/tentative-legal$1 break;
        proxy_pass $core;
        proxy_set_header Host $host;
    }

    location /api/v1/admin/conflicts {
        set $core http://eidos-core:8080;
        rewrite ^/api/v1/admin/conflicts(.*)$ /api/v1/internal/tentative$1 break;
        proxy_pass $core;
        proxy_set_header Host $host;
    }

    # --- Остальное API (дашборд, аудит, согласия): ui-backend проверяет JWT сам ---
    location /api/ {
        set $bff http://eidos-cdi-ui-backend:8083;
        proxy_pass $bff;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любые клиентские маршруты отдаём через index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

spring.application.name=eidos-stage
server.port=8081

# MongoDB (хранилище сырых данных источников).
# ВАЖНО: в Spring Boot 4.0 свойства подключения Mongo переехали с префикса
# spring.data.mongodb.* на spring.mongodb.* (старый ключ deprecated level=error и
# молча игнорируется → откат на localhost). Имя БД встроено в URI.
# Переопределять в докере через SPRING_MONGODB_URI.
spring.mongodb.uri=mongodb://localhost:27017/eidos_stage
eidos.stage.raw-collection=raw_client_data

# Реестр источников и конструктор дата-контрактов (PostgreSQL, владелец схемы)
spring.datasource.url=jdbc:postgresql://localhost:5432/eidos_registry
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Внутренний admin API (UI-backend), заголовок X-Admin-Token
eidos.stage.admin-token=change-me-admin-token

# eidos-core
eidos.core.base-url=http://localhost:8080
